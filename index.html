<body>

<!-- ==================== PORTADA ==================== -->
<div id="portada" onclick="Nav.entrar()">
  <canvas id="petalCanvas"></canvas>
  <div class="portada-inner">
    <div class="portada-icon">🌸</div>
    <h1 class="portada-title">Nosotros</h1>
    <p class="portada-sub">Un lugar solo para los dos</p>
    <button class="tap-btn" onclick="event.stopPropagation(); Nav.entrar()">Entrar &nbsp;→</button>
  </div>
</div>

<!-- ==================== PANTALLA PRINCIPAL ==================== -->
<div id="cine">

  <p class="cine-tag">💕 llevamos juntos</p>
  <h2 class="cine-headline">Cada día contigo cuenta</h2>

  <div class="contador-wrap">
    <div class="cont-card">
      <span class="cont-num" id="numDias">0</span>
      <span class="cont-label">Días</span>
    </div>
    <div class="cont-card">
      <span class="cont-num" id="numMeses">0</span>
      <span class="cont-label">Meses</span>
    </div>
    <div class="cont-card">
      <span class="cont-num" id="numHoras">0</span>
      <span class="cont-label">Horas</span>
    </div>
  </div>
  <p class="minseg-line" id="minSegLine">— : — actualizando…</p>

  <div id="cuentaEstado" class="cuenta-card" hidden></div>

  <div id="mesBadge">
    <p>🎉 ¡Hoy cumplen <strong id="mesNum">0</strong> meses juntos! Feliz mensiversario 💕</p>
  </div>

  <div class="fecha-row">
    <label>📅 Desde:</label>
    <input type="date" id="fechaInicio" onchange="Store.guardarFecha()" />
  </div>

  <button class="poro-entry" onclick="Nav.irPorotitos()">
    <span class="poro-entry-icon">💗</span>
    <span class="poro-entry-txt"><strong id="poroEntryNombre">Corazoncitos</strong><small>Sumá, restá y canjeá premios</small></span>
    <span class="poro-entry-arrow">→</span>
  </button>

  <button class="poro-entry mom-entry" onclick="Nav.irMomentos()">
    <span class="poro-entry-icon">📸</span>
    <span class="poro-entry-txt"><strong id="momEntryNombre">Momentos</strong><small>Nuestros recuerdos juntos</small></span>
    <span class="poro-entry-arrow">→</span>
  </button>

  <div class="frase-card">
    <button class="edit-frase-btn" onclick="Frases.toggleEdit()" title="Editar frase">✏️</button>
    <p class="frase-display" id="fraseDisplay"></p>
    <textarea class="frase-edit-input" id="fraseEditArea" rows="3" onblur="Frases.guardar()"></textarea>
  </div>

  <div class="frases-section">
    <button class="panel-toggle" onclick="UI.togglePanel('frasesPanel','frasesArrow')">
      <span>🌿 Frases adicionales (se alternan al entrar)</span>
      <span id="frasesArrow">▸</span>
    </button>
    <div class="collapsible" id="frasesPanel">
      <div id="frasesLista"></div>
      <button class="add-frase-btn" onclick="Frases.agregar()">+ Agregar frase</button>
    </div>
  </div>

  <button class="back-btn" onclick="Nav.volver()">← Volver a la portada</button>
</div>

<!-- ==================== POROTITOS ==================== -->
<div id="poro">
  <p class="cine-tag">💕 entre nosotros</p>
  <h2 class="cine-headline poro-headline">
    <span id="poroTitulo">Corazoncitos</span>
    <button id="poroRenombrar" class="poro-renombrar" title="Cambiar el nombre" hidden>✏️</button>
  </h2>
  <div id="poroContenido"></div>
  <button class="back-btn" onclick="Nav.volverDePorotitos()">← Volver</button>
</div>

<!-- ==================== MOMENTOS ==================== -->
<div id="mom">
  <p class="cine-tag">📸 nuestros recuerdos</p>
  <h2 class="cine-headline poro-headline">
    <span id="momTitulo">Momentos</span>
    <button id="momRenombrar" class="poro-renombrar" title="Cambiar el nombre" hidden>✏️</button>
  </h2>
  <div id="momContenido"></div>
  <button class="back-btn" onclick="Nav.volverDeMomentos()">← Volver</button>
</div>

<!-- ==================== SCRIPTS ==================== -->
<script type="module" src="js/main.js?v=202611202343"></script>
</body>
</html>
